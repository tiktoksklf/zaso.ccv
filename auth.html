<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up / Log in — zaso.cc</title><link rel="stylesheet" href="app.css"></head><body><header><a href="index.html">zaso<span>.</span>cc</a></header><main class="wrap"><section class="panel narrow"><h1 id="heading">Create your account</h1><p>Make your corner of the internet yours.</p><div class="row"><button id="signupTab">Sign up</button><button id="loginTab" class="secondary">Log in</button></div><form id="authForm"><div id="usernameWrap"><label for="username">Username</label><input id="username" autocomplete="username" minlength="3" maxlength="20" pattern="[a-z0-9_]{3,20}" required></div><label for="email">Email</label><input type="email" id="email" autocomplete="email" required><label for="password">Password (minimum 6 characters)</label><input type="password" id="password" autocomplete="new-password" minlength="6" required><button id="submit" style="margin-top:20px;width:100%">Create account</button></form><p id="status" class="status" role="status"></p><p class="muted">After verifying your email, sign in to finish claiming your username.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script>
const $=id=>document.getElementById(id);let mode='signup';const params=new URLSearchParams(location.search);$('username').value=(params.get('username')||sessionStorage.getItem('zaso_claim')||'').toLowerCase();function tab(m){mode=m;const sign=m==='signup';$('usernameWrap').classList.toggle('hide',!sign);$('username').required=sign;$('heading').textContent=sign?'Create your account':'Welcome back';$('submit').textContent=sign?'Create account':'Log in';$('signupTab').className=sign?'':'secondary';$('loginTab').className=sign?'secondary':'';$('password').autocomplete=sign?'new-password':'current-password';$('status').textContent=''}$('signupTab').onclick=()=>tab('signup');$('loginTab').onclick=()=>tab('login');$('authForm').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('status').textContent='Please wait…';try{const email=$('email').value.trim(),password=$('password').value;if(mode==='signup'){const username=$('username').value.trim().toLowerCase();if(!validUsername(username))throw Error('Username must be 3–20 lowercase letters, numbers or underscores.');const {data:existing,error:checkError}=await db.from('profiles').select('username').eq('username',username).maybeSingle();if(checkError)throw checkError;if(existing)throw Error('Username is already taken.');sessionStorage.setItem('zaso_claim',username);localStorage.setItem('zaso_pending_verification','1');const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/auth.html?verified=1',data:{requested_username:username}}});if(error)throw error;if(data.session){location.href='dashboard.html';return}$('status').textContent='Check your email for a verification link. After verifying, come back here and log in.';tab('login');$('status').textContent='Verification email sent. After confirming, log in here — do not create another account.';}else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;location.href='dashboard.html'}}catch(err){$('status').textContent=err.message||'Something went wrong'}finally{$('submit').disabled=false}};(async()=>{
  const qs=new URLSearchParams(location.search);
  const hash=new URLSearchParams(location.hash.slice(1));
  const callback=qs.has('verified')||qs.has('code')||hash.has('access_token')||qs.has('error')||hash.has('error');
  if(callback||localStorage.getItem('zaso_pending_verification')==='1'){
    tab('login');
    $('status').textContent=qs.has('error')||hash.has('error')
      ? (qs.get('error_description')||hash.get('error_description')||'Verification link failed. Try logging in if your email is already confirmed.')
      : 'If you have verified your email, log in below. You do not need to create another account.';
    localStorage.removeItem('zaso_pending_verification');
    // Confirmation links can establish a session automatically. This page deliberately
    // stays on Log in so the user can continue with their existing account.
    return;
  }
  const {data:{session}}=await db.auth.getSession();
  if(session)location.replace('dashboard.html');
})();</script></body></html>
