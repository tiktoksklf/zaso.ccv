<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101017">
<meta name="description" content="Discover a creator's links and public profile on zaso.cc.">
<title>Profile — zaso.cc</title>
<link rel="stylesheet" href="templates.css">
<link rel="stylesheet" href="social.css">
<link rel="stylesheet" href="effects.css">
<style>
*{box-sizing:border-box}body{margin:0}a:focus-visible,button:focus-visible{outline:3px solid #d6b7ff;outline-offset:3px}
/* Never reserve an ad slot for Pro/Elite profiles, including on narrow screens. */
.profile-stage[data-ad-free="true"] .creator-ad,
.profile-stage[data-ad-free="true"] .ad-space,
.profile-stage[data-ad-free="true"] .ad-placeholder{display:none!important;height:0!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important}
.age-overlay{position:fixed;inset:0;z-index:9999;background:#06050bdc;backdrop-filter:blur(16px);display:grid;place-items:center;padding:20px}
.age-overlay[hidden]{display:none}.age-box{background:#1b1726;color:#f6f2ff;border:1px solid #c7adee65;border-radius:24px;max-width:420px;width:100%;padding:32px;box-shadow:0 30px 90px #0009;text-align:center;font:15px/1.6 system-ui}.age-box h2{font-size:26px;margin:12px 0}.age-box p{color:#c7bfce}.age-actions{display:flex;gap:12px;justify-content:center;margin-top:22px}.age-actions button{background:#c7adee;color:#1c1329;border:0;border-radius:11px;padding:12px 22px;font-weight:700;cursor:pointer}.age-actions .cancel{background:#ffffff17;color:#fff;border:1px solid #ffffff30}

/* Official owner badge, visible only when confirmed by the server. */
.z-profile-hero .z-handle.z-handle--badged{
  display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
}
.z-owner-badge{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:6px 10px 6px 9px;border-radius:999px;
  border:1px solid rgba(214,176,255,.6);
  background:linear-gradient(135deg,rgba(107,58,145,.9),rgba(50,29,82,.96));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 0 16px rgba(167,99,240,.18);
  color:#f2e3ff;font:800 10px/1 system-ui,-apple-system,Segoe UI,sans-serif;
  letter-spacing:1.2px;white-space:nowrap;text-shadow:none;
}
.z-owner-badge svg{display:block;width:13px;height:13px;flex:none;stroke:#f6dc9b}
@media(max-width:430px){.z-owner-badge{padding:5px 9px;font-size:9px}}
/* Server-assigned Verified / Developer / Staff labels; never from editable theme JSON. */
.z-profile-hero .z-handle.z-handle--badged{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.z-role-badge{display:inline-flex;align-items:center;gap:5px;font:800 10px/1 system-ui,-apple-system,sans-serif;letter-spacing:.55px;padding:6px 9px;border-radius:999px;white-space:nowrap;border:1px solid #b7a0d366;background:#2c2146cc;color:#e9ddff;text-shadow:none}
.z-role-badge svg{height:13px;width:13px;stroke:currentColor;fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-width:2.2}
.z-role-badge--verified{border-color:#66b4ff77;background:#0f3554e6;color:#c5e9ff}
.z-role-badge--developer{border-color:#a591e277;background:#34215bdf;color:#e4d5ff}
.z-role-badge--staff{border-color:#f5cb817d;background:#53361ce0;color:#ffe5b1}
@media(max-width:430px){.z-role-badge{font-size:9px;padding:5px 8px}}

</style>
</head>
<body>
<main id="stage" class="profile-stage" data-template="afterhours"><section class="creator" id="card" aria-live="polite"><p>Loading profile…</p></section></main>
<div class="age-overlay" id="adultWarning" role="dialog" aria-modal="true" aria-labelledby="ageTitle" hidden><div class="age-box"><div style="font-size:34px">⚠</div><h2 id="ageTitle">Potential 18+ content</h2><p>This link may contain adult content intended for people aged 18 or older. Do you want to continue to the external website?</p><div class="age-actions"><button id="adultCancel" class="cancel" type="button">Cancel</button><button id="adultContinue" type="button">Continue ↗</button></div><p style="font-size:12px">zaso.cc does not control content on external sites.</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="social.js"></script>
<script src="wallet.js"></script>
<script src="profile-renderer.js?v=spotify-roles-1"></script>
<script src="effects.js"></script>
<script>
function showAdultWarning(url){
 const modal=document.getElementById('adultWarning');modal.hidden=false;document.body.style.overflow='hidden';
 const cancel=document.getElementById('adultCancel');const proceed=document.getElementById('adultContinue');
 cancel.focus();
 function close(){modal.hidden=true;document.body.style.overflow='';cancel.removeEventListener('click',close);proceed.removeEventListener('click',go);modal.removeEventListener('keydown',key)}
 function go(){close();window.open(url,'_blank','noopener,noreferrer')}
 function key(e){if(e.key==='Escape')close()}
 cancel.addEventListener('click',close);proceed.addEventListener('click',go);modal.addEventListener('keydown',key);
}
(async()=>{
 const raw=new URLSearchParams(location.search).get('u')||decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
 const username=raw.toLowerCase();const card=document.getElementById('card');
 function fail(msg){card.replaceChildren();const p=document.createElement('p');p.textContent=msg;card.append(p)}
 if(!validUsername(username)){fail('Profile not found');return}
 const {data:p,error}=await db.from('profiles').select('*').eq('username',username).maybeSingle();
 if(error||!p){fail('Profile not found');return}
 document.title=(p.display_name||p.username)+' — zaso.cc';
 const {data:links, error:linkError}=await db.from('profile_links').select('title,url,icon').eq('user_id',p.id).order('position');
 if(linkError)console.warn('Profile links could not be loaded',linkError.message);
 // Subscription rows are private under RLS. Visitors viewing a Pro profile on
 // mobile or in a logged-out browser cannot safely read that table directly.
 // This public, read-only RPC returns only whether the profile is ad-free.
 // If the check is temporarily unavailable, do not display ads by mistake.
 let adFree=true;
 const {data:adFreeResult,error:adFreeError}=await db.rpc('zaso_profile_is_ad_free',{profile_id:p.id});
 if(adFreeError){
   console.warn('Could not verify profile ad entitlement',adFreeError.message);
 }else{
   adFree=adFreeResult===true;
 }
 const stage=document.getElementById('stage');
 stage.dataset.adFree=String(adFree);
 ZasoProfiles.render(stage,p,links||[],{showAd:!adFree,showBrand:!adFree,onAdult:showAdultWarning});

 // Read-only, server-confirmed badge. Do not derive owner status from
 // username, display name, theme, or any browser-editable profile field.
 try {
   const {data:isOwner,error:badgeError}=await db.rpc('zaso_profile_is_owner',{profile_id:p.id});
   if(badgeError){
     console.warn('Owner badge lookup unavailable',badgeError.message);
   }else if(isOwner===true){
     const handle=stage.querySelector('.z-profile-hero .z-handle');
     if(handle){
       handle.classList.add('z-handle--badged');
       const badge=document.createElement('span');
       badge.className='z-owner-badge';
       badge.setAttribute('aria-label','Official zaso.cc owner');
       badge.title='Official zaso.cc owner';
       badge.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 8 4.6 4 5.4-8 5.4 8L22 8l-2 11H4L2 8Z"/><path d="M4 22h16"/></svg><span>OWNER</span>';
       handle.append(badge);
     }
   }
 } catch(err) {
   console.warn('Owner badge lookup failed',err);
 }

 // Badges are read from a SECURITY DEFINER read-only RPC backed by a
 // protected assignment table. User-owned profile fields cannot grant badges.
 try {
   const {data:roles,error:roleError}=await db.rpc('zaso_profile_public_roles',{profile_id:p.id});
   if(roleError)console.warn('Role badge lookup unavailable',roleError.message);
   else if(Array.isArray(roles)){
     const handle=stage.querySelector('.z-profile-hero .z-handle');
     const defs={
       verified:{label:'VERIFIED',title:'Verified zaso.cc profile',icon:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'},
       developer:{label:'DEVELOPER',title:'Official zaso.cc developer',icon:'<path d="m8 8-4 4 4 4m8-8 4 4-4 4m-3-12-2 16"/>'},
       staff:{label:'STAFF',title:'Official zaso.cc staff',icon:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>'}
     };
     if(handle){
       for(const role of ['verified','developer','staff']){
         if(!roles.includes(role))continue;
         handle.classList.add('z-handle--badged');
         const d=defs[role];const badge=document.createElement('span');
         badge.className='z-role-badge z-role-badge--'+role;
         badge.setAttribute('aria-label',d.title);badge.title=d.title;
         badge.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">'+d.icon+'</svg><span>'+d.label+'</span>';
         handle.append(badge);
       }
     }
   }
 }catch(err){console.warn('Role badge lookup failed',err);}

 if(window.ZasoEffects)ZasoEffects.apply(p.theme||{});
})().catch(err=>{
 console.error('Profile load error',err);
 document.getElementById('card').textContent='Unable to load profile. Please try again.';
});
</script>
</body>
</html>
