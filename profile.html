<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — zaso.cc</title><link rel="stylesheet" href="app.css"><style>body{background-size:cover;background-position:center;background-attachment:fixed}.public{max-width:520px;text-align:center;margin:60px auto}.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #c7adee}.publiclinks a{display:block;margin:12px 0;padding:15px;background:#ffffff16;border:1px solid #ffffff26;border-radius:13px;color:white}.ad{margin-top:40px;padding:10px;border:1px dashed #ffffff44;color:#aaa4b6;font-size:12px}</style></head><body><header><a href="index.html">zaso<span>.</span>cc</a></header><main class="wrap"><section class="panel public" id="card"><p>Loading profile…</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script>
(async()=>{const u=new URLSearchParams(location.search).get('u')||decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'').toLowerCase();const card=document.getElementById('card');if(!validUsername(u)){card.textContent='Profile not found';return}const {data:p,error}=await db.from('profiles').select('*').eq('username',u).maybeSingle();if(error||!p){card.textContent='Profile not found';return}document.title=(p.display_name||p.username)+' — zaso.cc';if(p.background_url?.startsWith('https://'))document.body.style.backgroundImage='linear-gradient(#0b0b10a8,#0b0b10c9),url('+JSON.stringify(p.background_url)+')';const name=document.createElement('h1');name.textContent=p.display_name||p.username;const handle=document.createElement('p');handle.textContent='@'+p.username;const bio=document.createElement('p');bio.textContent=p.bio||'';card.replaceChildren();if(p.avatar_url?.startsWith('https://')){const avatar=document.createElement('img');avatar.className='avatar';avatar.src=p.avatar_url;avatar.alt='Profile avatar';card.append(avatar)}card.append(name,handle,bio);const {data:links}=await db.from('profile_links').select('title,url').eq('user_id',p.id).order('position');const list=document.createElement('div');list.className='publiclinks';for(const l of links||[]){try{const url=new URL(l.url);if(!['https:','http:'].includes(url.protocol))continue;const a=document.createElement('a');a.textContent=l.title;a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';list.append(a)}catch{}}card.append(list);const {data:sub}=await db.from('subscriptions').select('plan,status').eq('user_id',p.id).maybeSingle();if(!sub||sub.plan==='free'||sub.status!=='active'){const ad=document.createElement('div');ad.className='ad';ad.textContent='Advertisement space · zaso.cc Free';card.append(ad)}})();</script></body></html>
