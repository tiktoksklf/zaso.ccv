<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b10"><title>Profile — zaso.cc</title><link rel="stylesheet" href="templates.css"><style>*{box-sizing:border-box}body{margin:0}a:focus-visible{outline:3px solid #d6b7ff;outline-offset:3px}.error{color:#fff;background:#111;padding:40px;text-align:center;font-family:system-ui}</style></head><body><main id="stage" class="profile-stage" data-template="nocturne"><section class="creator" id="card" aria-live="polite"><p>Loading profile…</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script>
(async()=>{const raw=new URLSearchParams(location.search).get('u')||decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');const username=raw.toLowerCase();const card=document.getElementById('card');const stage=document.getElementById('stage');function fail(msg){card.replaceChildren();const p=document.createElement('p');p.textContent=msg;card.append(p)}if(!validUsername(username)){fail('Profile not found');return}const {data:p,error}=await db.from('profiles').select('*').eq('username',username).maybeSingle();if(error||!p){fail('Profile not found');return}const allowed=['nocturne','aurora','editorial','obsidian','solstice'];stage.dataset.template=allowed.includes(p.theme?.template)?p.theme.template:'nocturne';document.title=(p.display_name||p.username)+' — zaso.cc';if(p.background_url?.startsWith('https://')){stage.style.backgroundImage='linear-gradient(#09081288,#090812bb),url('+JSON.stringify(p.background_url)+')';stage.style.backgroundSize='cover';stage.style.backgroundPosition='center'}card.replaceChildren();if(p.avatar_url?.startsWith('https://')){const avatar=document.createElement('img');avatar.className='creator-avatar';avatar.src=p.avatar_url;avatar.alt='Profile avatar';avatar.referrerPolicy='no-referrer';card.append(avatar)}else{const fallback=document.createElement('div');fallback.className='creator-initial';fallback.textContent=(p.display_name||p.username).charAt(0).toUpperCase();card.append(fallback)}function el(tag,cls,value){const n=document.createElement(tag);n.className=cls;n.textContent=value;card.append(n);return n}el('h1','',p.display_name||p.username);el('p','handle','@'+p.username);if(p.bio)el('p','creator-bio',p.bio);const {data:links}=await db.from('profile_links').select('title,url').eq('user_id',p.id).order('position');const list=el('div','creator-links','');for(const l of links||[]){try{const url=new URL(l.url);if(!['https:','http:'].includes(url.protocol))continue;const a=document.createElement('a');a.textContent=l.title;a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';list.append(a)}catch{}}const {data:sub}=await db.from('subscriptions').select('plan,status').eq('user_id',p.id).maybeSingle();if(!sub||sub.plan==='free'||sub.status!=='active')el('div','creator-ad','Advertisement space · zaso.cc Free');el('div','creator-brand','made with zaso.cc')})().catch(()=>{document.getElementById('card').textContent='Unable to load profile. Please try again.'});
</script></body></html>
