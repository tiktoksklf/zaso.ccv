<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b10"><title>Profile — zaso.cc</title><link rel="stylesheet" href="templates.css"><link rel="stylesheet" href="social.css"><link rel="stylesheet" href="effects.css"><style>*{box-sizing:border-box}body{margin:0}a:focus-visible{outline:3px solid #d6b7ff;outline-offset:3px}.error{color:#fff;background:#111;padding:40px;text-align:center;font-family:system-ui}</style></head><body><main id="stage" class="profile-stage" data-template="nocturne"><section class="creator" id="card" aria-live="polite"><p>Loading profile…</p></section></main><div class="age-overlay" id="adultWarning" role="dialog" aria-modal="true" aria-labelledby="ageTitle" hidden><div class="age-box"><div style="font-size:34px">⚠</div><h2 id="ageTitle">Potential 18+ content</h2><p>This link may contain adult content intended for people aged 18 or older. Do you want to continue to the external website?</p><div class="age-actions"><button id="adultCancel" class="cancel" type="button">Cancel</button><button id="adultContinue" type="button">Continue ↗</button></div><p style="font-size:12px">zaso.cc does not control content on external sites.</p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="social.js"></script><script src="effects.js"></script><script>
function showAdultWarning(url){const modal=document.getElementById('adultWarning');modal.hidden=false;document.body.style.overflow='hidden';const cancel=document.getElementById('adultCancel');const proceed=document.getElementById('adultContinue');cancel.focus();function close(){modal.hidden=true;document.body.style.overflow='';cancel.removeEventListener('click',close);proceed.removeEventListener('click',go);modal.removeEventListener('keydown',key)}function go(){close();window.open(url,'_blank','noopener,noreferrer')}function key(e){if(e.key==='Escape')close()}cancel.addEventListener('click',close);proceed.addEventListener('click',go);modal.addEventListener('keydown',key)}
(async()=>{const raw=new URLSearchParams(location.search).get('u')||decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');const username=raw.toLowerCase();const card=document.getElementById('card');const stage=document.getElementById('stage');function fail(msg){card.replaceChildren();const p=document.createElement('p');p.textContent=msg;card.append(p)}if(!validUsername(username)){fail('Profile not found');return}const {data:p,error}=await db.from('profiles').select('*').eq('username',username).maybeSingle();if(error||!p){fail('Profile not found');return}const allowed=['nocturne','aurora','editorial','obsidian','solstice'];stage.dataset.template=allowed.includes(p.theme?.template)?p.theme.template:'nocturne';window.ZasoEffects.apply(p.theme||{});document.title=(p.display_name||p.username)+' — zaso.cc';if(p.background_url?.startsWith('https://')){stage.style.backgroundImage='linear-gradient(#09081288,#090812bb),url('+JSON.stringify(p.background_url)+')';stage.style.backgroundSize='cover';stage.style.backgroundPosition='center'}card.replaceChildren();if(p.avatar_url?.startsWith('https://')){const avatar=document.createElement('img');avatar.className='creator-avatar';avatar.src=p.avatar_url;avatar.alt='Profile avatar';avatar.referrerPolicy='no-referrer';card.append(avatar)}else{const fallback=document.createElement('div');fallback.className='creator-initial';fallback.textContent=(p.display_name||p.username).charAt(0).toUpperCase();card.append(fallback)}function el(tag,cls,value){const n=document.createElement(tag);n.className=cls;n.textContent=value;card.append(n);return n}el('h1','',p.display_name||p.username);el('p','handle','@'+p.username);if(p.bio)el('p','creator-bio',p.bio);const {data:links}=await db.from('profile_links').select('title,url,icon').eq('user_id',p.id).order('position');const list=el('div','creator-links','');for(const l of links||[]){try{const url=new URL(l.url);if(!['https:','http:'].includes(url.protocol))continue;const a=document.createElement('a');const metadata=linkMetadata(l.icon);const adult=metadata.adult||isAdultDomain(url.href);const gif=(l.icon||'').split('|').slice(2).join('|');if(gif&&/^https:\/\//i.test(gif)){const img=document.createElement('img');img.className='zaso-link-gif';img.src=gif;img.alt='';img.loading='lazy';img.onerror=()=>img.replaceWith(socialIcon(metadata.platform));a.append(img)}else a.append(socialIcon(metadata.platform));a.append(document.createTextNode(l.title));if(adult){const tag=document.createElement('span');tag.className='adult-label';tag.textContent='18+';a.append(tag);a.addEventListener('click',e=>{e.preventDefault();showAdultWarning(url.href)})}a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';list.append(a)}catch{}}const {data:sub}=await db.from('subscriptions').select('plan,status').eq('user_id',p.id).maybeSingle();if(!sub||sub.plan==='free'||sub.status!=='active')el('div','creator-ad','Advertisement space · zaso.cc Free');el('div','creator-brand','made with zaso.cc')})().catch(()=>{document.getElementById('card').textContent='Unable to load profile. Please try again.'});
</script></body></html>
