<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Template preview — zaso.cc</title><link rel="stylesheet" href="templates.css"><link rel="stylesheet" href="effects.css"><style>*{box-sizing:border-box}body{margin:0}.preview-nav{position:fixed;z-index:10;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:#11121de8;border:1px solid #ffffff30;border-radius:20px;padding:9px;backdrop-filter:blur(20px);box-shadow:0 15px 50px #0008;max-width:calc(100% - 20px)}.preview-nav button,.preview-nav a{font:600 12px system-ui;color:#eee;background:#ffffff15;border:1px solid #ffffff28;padding:8px 11px;border-radius:10px;cursor:pointer;text-decoration:none;white-space:nowrap}.preview-nav button[aria-pressed="true"]{background:#c7adee;color:#180e20}.profile-stage{padding-top:125px;min-height:100vh}.creator-links a{cursor:default}@media(max-width:700px){.preview-nav{width:calc(100% - 16px)}.preview-nav button{padding:7px}.profile-stage{padding-top:150px}}</style></head><body><nav class="preview-nav" id="nav" aria-label="Template selection"><a href="dashboard.html">← Dashboard</a></nav><div class="zaso-preview-settings" id="effectPanel" style="position:fixed;z-index:11;bottom:16px;left:50%;transform:translateX(-50%)"><strong>Atmosphere</strong><label><input type="checkbox" data-fx="snow"> ❄ Snow</label><label><input type="checkbox" data-fx="rain"> 🌧 Rain</label><label><input type="checkbox" data-fx="storm"> ⛈ Storm</label><label><input type="checkbox" data-fx="floating"> Float</label><label><input type="checkbox" data-fx="glow"> Glow</label><label><input type="checkbox" data-fx="sparkle"> Sparkle</label></div><main id="stage" class="profile-stage" data-template="nocturne"><section class="creator"><div class="creator-initial">Z</div><h1>your name.</h1><p class="handle">@yourusername</p><p class="creator-bio">A little bit of everything. Welcome to my corner of the internet ✦</p><div class="creator-links"><a>Instagram ↗</a><a>TikTok ↗</a><a>My latest project ↗</a></div><div class="creator-ad">Advertisement space · zaso.cc Free</div><div class="creator-brand">made with zaso.cc</div></section></main><script src="effects.js"></script><script>const names=[['nocturne','Nocturne'],['aurora','Aurora'],['editorial','Editorial'],['obsidian','Obsidian'],['solstice','Solstice']];const stage=document.getElementById('stage');const nav=document.getElementById('nav');const buttons=[];function choose(id){stage.dataset.template=id;history.replaceState(null,'','?t='+encodeURIComponent(id));buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)))}for(const [id,name]of names){const b=document.createElement('button');b.textContent=name;b.dataset.id=id;b.onclick=()=>choose(id);nav.append(b);buttons.push(b)}const param=new URLSearchParams(location.search).get('t');choose(names.some(x=>x[0]===param)?param:'nocturne');const fxChecks=[...document.querySelectorAll('[data-fx]')];function updateFx(){const selected=fxChecks.filter(x=>x.checked).map(x=>x.dataset.fx);ZasoEffects.apply({weather:selected.includes('storm')?'storm':selected.includes('rain')?'rain':selected.includes('snow')?'snow':'none',floating:selected.includes('floating'),glow:selected.includes('glow'),sparkle:selected.includes('sparkle')})}fxChecks.forEach(x=>x.addEventListener('change',()=>{if(x.checked&&['snow','rain','storm'].includes(x.dataset.fx))fxChecks.filter(y=>['snow','rain','storm'].includes(y.dataset.fx)&&y!==x).forEach(y=>y.checked=false);updateFx()}));updateFx();</script></body></html>
